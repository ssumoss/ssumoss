
# GitHub Action for generating a contribution graph snake

name: Generate Snake

# Runs automatically every 6 hours
on:
  schedule:
    - cron: "0 */6 * * *"

  # Allows manual execution from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Required permissions
    permissions:
      contents: write

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Generate snake animation
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ssumoss
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake.svg

      # Push generated files to output branch
      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

